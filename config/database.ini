# config/database.ini
# Database and persistence configuration for Space Battle Wars.
#
# Consumed by dbLoadConfig() in src/db/db.c++.
# Format: [section] then key = value.  Lines starting with # are comments.

[mysql]
# Set to 1 to attempt a MySQL connection at startup.
enabled = 1

host = 127.0.0.1
port = 3306
user = sbw
password = changeme
database = spacebattlewars
charset = utf8mb4

# Connection pool sizing.
pool_size = 4
timeout_seconds = 5

[schema]
# Create missing tables on startup.
auto_create = 1
# Drop and recreate on startup (destructive; development only).
auto_reset = 0

[persistence]
# Push the framework data tables into MySQL on startup.
save_framework_on_start = 0
# Pull the framework data tables from MySQL instead of the built-in seeds.
load_framework_on_start = 0
# Save the player and run score on every turn.
autosave = 1

[excel]
# Directory that csvExportAll() writes to.
export_dir = data/export
# Write a CSV after every balance-affecting change.
export_on_save = 0
# Imported back over the item table when present.
import_items = data/import/items.csv
