# config/game.ini
# Gameplay configuration for Space Battle Wars.
# Consumed by the engine config loader.

[game]
title = Space Battle Wars Simulation Program
version = 2.0.0
engine = krypton v1.0

[display]
# Terminal target.  Must fit the 80x24 assumptions in core/types.h.
columns = 80
rows = 24
# Number of blank lines used to emulate a screen clear.
clear_lines = 24

[startup]
# Show the bootloader banner before the title screen.
bootloader = 1
# Show the loading screen with a progress bar.
loading_screen = 1
# Show the title logo art.
title_art = 1

[combat]
# PvE / PvP rule set.  PvP applies the conversion table in docs/FRAMEWORK.md s.17.
pvp_enabled = 0
# Critical chance hard cap, in basis points.
crit_cap_pve = 7000
crit_cap_pvp = 4000
# Cooldown reduction cap.
cdr_cap_pve = 6000
cdr_cap_pvp = 3500
# Damage reduction cap.
dr_cap = 7000

[scaling]
# Level scaling coefficients (see docs/FRAMEWORK.md s.10).
hp_level_coefficient = 18
damage_level_coefficient = 12
# Party multiplier per extra player, as a percentage.
party_coefficient = 65

[loot]
# Luck is bounded so it can never break the economy.
luck_cap = 50
# Pity timer: rolls without a rare before one is forced.
pity_timer = 20

[difficulty]
# Difficulty tiers, weakest first.
tiers = Normal, Hard, Brutal, Mythic
# Damage multiplier per tier, as a percentage.
multipliers = 100, 125, 160, 220
